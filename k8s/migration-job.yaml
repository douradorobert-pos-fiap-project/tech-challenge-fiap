apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrations
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: oficina-api
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: alembic
          image: ghcr.io/douradorobert/tech-challenge-fiap/tech-challenge-app:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: DATABASE_URL
            - name: CPF_VALIDATOR_LAMBDA_ARN
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: CPF_VALIDATOR_LAMBDA_ARN
          command:
            - sh
            - -c
            - |
              echo "Aguardando conectividade com o banco..."
              DB_READY=false
              for i in $(seq 1 30); do
                python -c "import psycopg2,os; psycopg2.connect(os.environ['DATABASE_URL'])" 2>/dev/null \
                  && DB_READY=true && echo "Banco pronto!" && break
                echo "Tentativa $i/30 - aguardando 2s..."
                sleep 2
              done
              if [ "${DB_READY}" != "true" ]; then
                echo "Não foi possível conectar ao banco após 30 tentativas."
                exit 1
              fi
              echo "Rodando migrations..."
              alembic -c /app/alembic.ini upgrade head
