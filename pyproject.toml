[project]
name = "tech-challenge-fiap"
version = "0.1.0"
description = "Sistema Integrado de Atendimento e Execução de Servicos para Oficina Mecanica"
authors = [
    {name = "FIAP"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.115.0,<0.116.0"
uvicorn = {version = ">=0.30.0,<0.31.0", extras = ["standard"]}
sqlalchemy = ">=2.0.0,<3.0.0"
alembic = ">=1.13.0,<2.0.0"
pydantic = ">=2.0.0,<3.0.0"
pydantic-settings = ">=2.0.0,<3.0.0"
python-jose = {version = ">=3.3.0,<4.0.0", extras = ["cryptography"]}
passlib = {version = ">=1.7.0,<2.0.0", extras = ["bcrypt"]}
email-validator = ">=2.0.0,<3.0.0"
psycopg2-binary = ">=2.9.0,<3.0.0"

[tool.poetry]
package-mode = false

[project.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-cov = ">=5.0.0,<6.0.0"
pytest-mock = ">=3.12.0,<4.0.0"
httpx = ">=0.27.0,<0.28.0"
[tool.poetry.group.test.dependencies]
isort = "5.13.2"
black = "24.3.0"
flake8 = "7.0.0"
pre-commit = "3.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/migrations/*", "tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.flake8]
select = ['B', 'C', 'E', 'F', 'W', 'T4', 'B9']
ignore = ['E202','E203', 'E266', 'E501', 'W503', 'F403', 'E712', 'E226', 'E722', 'W605', 'F405', 'E721', 'E704', 'E402']
max-line-length = 88
max-complexity = 37

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
