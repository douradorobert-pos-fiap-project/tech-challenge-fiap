name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Configurar Poetry
        run: poetry config virtualenvs.create false

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Executar lint
        run: |
          poetry run black --check .
          poetry run isort --check-only .

      - name: Executar testes com cobertura
        run: poetry run pytest --cov=src --cov-report=term --cov-fail-under=80

      - name: Build da imagem (dry-run)
        run: docker build -t tech-challenge-app:${{ github.sha }} .

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Configurar Poetry
        run: poetry config virtualenvs.create false

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build e push da imagem
        run: |
          IMAGE="ghcr.io/${{ secrets.GHCR_USERNAME }}/tech-challenge-fiap/tech-challenge-app"
          TAG="${{ github.sha }}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build-and-push
    if: >
      github.event_name == 'workflow_dispatch' ||
      (needs.build-and-push.result == 'success' && github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Atualizar tag da imagem nos manifestos
        run: |
          IMAGE="ghcr.io/${{ secrets.GHCR_USERNAME }}/tech-challenge-fiap/tech-challenge-app"
          TAG="${{ github.sha }}"
          sed -i "s|image: ghcr.io/.*/tech-challenge-app:.*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml
          sed -i "s|image: ghcr.io/.*/tech-challenge-app:.*|image: ${IMAGE}:${TAG}|" k8s/migration-job.yaml

      - name: Instalar Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: tech-challenge
          wait: 120s

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform init e apply
        working-directory: terraform
        env:
          TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Aguardar rollout do deployment
        run: |
          kubectl rollout status deployment/oficina-api -n oficina --timeout=120s
