name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Configurar Poetry
        run: poetry config virtualenvs.create false

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Executar lint
        run: |
          poetry run black --check .
          poetry run isort --check-only .

      - name: Executar testes com cobertura
        run: poetry run pytest --cov=src --cov-report=term --cov-fail-under=80

      - name: Build da imagem (dry-run)
        run: docker build -t tech-challenge-app:${{ github.sha }} .

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${ECR_REGISTRY}/application"
          docker build -t "${IMAGE}:${IMAGE_TAG}" .
          docker push "${IMAGE}:${IMAGE_TAG}"

  deploy:
    needs: build-and-push
    if: >
      github.event_name == 'workflow_dispatch' ||
      (needs.build-and-push.result == 'success' && github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Ler infraestrutura via Terraform
        id: infra
        working-directory: terraform/infra
        run: |
          terraform init -input=false
          terraform apply -refresh-only -auto-approve
          OUTPUTS=$(terraform output -json)
          python3 -c 'import sys,json; o=json.loads(sys.stdin.read()); r=["rds_endpoint","rds_port","database_name","database_username","eks_cluster_name","ecr_repository_url","lambda_arn","jwt_secret"]; m=[x for x in r if x not in o]; m and sys.exit("Terraform outputs ausentes no state app: " + ", ".join(m))' <<< "$OUTPUTS"

          echo "rds_endpoint=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["rds_endpoint"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "rds_port=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["rds_port"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "database_name=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["database_name"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "database_username=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["database_username"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["eks_cluster_name"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["ecr_repository_url"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "lambda_arn=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["lambda_arn"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "jwt_secret=$(echo $OUTPUTS | python3 -c 'import sys,json; print(json.load(sys.stdin)["jwt_secret"]["value"])')" >> "$GITHUB_OUTPUT"

      - name: Configurar kubectl
        env:
          EKS_CLUSTER_NAME: ${{ steps.infra.outputs.eks_cluster_name }}
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region us-east-1

      - name: Buscar valores derivados via AWS CLI
        id: derived
        run: |
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names sandbox-app-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || echo "")

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=sandbox-vpclink-*" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "")

          echo "target_group_arn=${TG_ARN}" >> "$GITHUB_OUTPUT"
          echo "vpc_link_sg_id=${SG_ID}" >> "$GITHUB_OUTPUT"

      - name: Atualizar tag da imagem nos manifestos
        run: |
          ECR_REPO="${{ steps.infra.outputs.ecr_repository_url }}"
          IMAGE_TAG="${{ github.sha }}"
          sed -i "s|image: ghcr.io/.*/tech-challenge-app:.*|image: ${ECR_REPO}:${IMAGE_TAG}|" k8s/deployment.yaml
          sed -i "s|image: ghcr.io/.*/tech-challenge-app:.*|image: ${ECR_REPO}:${IMAGE_TAG}|" k8s/migration-job.yaml

      - name: Criar secrets do Kubernetes
        env:
          DB_HOST: ${{ steps.infra.outputs.rds_endpoint }}
          DB_PORT: ${{ steps.infra.outputs.rds_port }}
          DB_NAME: ${{ steps.infra.outputs.database_name }}
          DB_USERNAME: ${{ steps.infra.outputs.database_username }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LAMBDA_ARN: ${{ steps.infra.outputs.lambda_arn }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          JWT_SECRET=$(terraform -chdir=terraform/infra output -raw jwt_secret)
          echo "::add-mask::${JWT_SECRET}"
          DATABASE_URL=$(python3 -c 'import os; from urllib.parse import quote; keys=("DB_USERNAME","DB_PASSWORD","DB_HOST","DB_PORT","DB_NAME"); print("postgresql://{}:{}@{}:{}/{}".format(*(quote(os.environ[k], safe="") for k in keys)))')

          kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic oficina-secrets \
            --namespace oficina \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=CPF_VALIDATOR_LAMBDA_ARN="${LAMBDA_ARN}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
            --from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          ECR_PASSWORD=$(aws ecr get-login-password --region us-east-1)
          kubectl create secret docker-registry ecr-secret \
            --namespace oficina \
            --docker-server="${ECR_REGISTRY}" \
            --docker-username=AWS \
            --docker-password="${ECR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Atualizar TargetGroupBinding
        env:
          TG_ARN: ${{ steps.derived.outputs.target_group_arn }}
          SG_ID: ${{ steps.derived.outputs.vpc_link_sg_id }}
        run: |
          sed -i "s|TARGET_GROUP_ARN_PLACEHOLDER|${TG_ARN}|" k8s/target-group-binding.yaml
          sed -i "s|SECURITY_GROUP_PLACEHOLDER|${SG_ID}|" k8s/target-group-binding.yaml

      - name: Validar AWS Load Balancer Controller
        run: |
          kubectl -n kube-system rollout status \
            deployment/aws-load-balancer-controller --timeout=120s

          CONTROLLER_SA=$(kubectl -n kube-system get serviceaccount \
            aws-load-balancer-controller \
            -o jsonpath='{.metadata.name}' 2>/dev/null || true)

          if [ -z "${CONTROLLER_SA}" ]; then
            echo "AWS Load Balancer Controller não está instalado no cluster"
            exit 1
          fi

          CONTROLLER_ROLE=$(kubectl -n kube-system get serviceaccount \
            aws-load-balancer-controller \
            -o jsonpath='{.metadata.annotations.eks\\.amazonaws\\.com/role-arn}' \
            2>/dev/null || true)

          if [ -n "${CONTROLLER_ROLE}" ]; then
            echo "O controller possui uma role IRSA configurada: ${CONTROLLER_ROLE}"
            echo "Remova a annotation IRSA ou configure uma role válida antes do deploy."
            exit 1
          fi

          echo "AWS Load Balancer Controller disponível: ${CONTROLLER_SA}"
          echo "O controller deve obter credenciais pela role dos nodes via IMDS."

      - name: Aplicar manifests no EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          # Jobs têm spec.template imutável; recria a migração com a imagem atual.
          kubectl delete job alembic-migrations \
            --namespace oficina \
            --ignore-not-found=true \
            --wait=true
          kubectl apply -f k8s/migration-job.yaml
          for i in $(seq 1 360); do
            COMPLETE=$(kubectl get job alembic-migrations -n oficina -o jsonpath="{.status.conditions[?(@.type==\"Complete\")].status}" 2>/dev/null || true)
            FAILED=$(kubectl get job alembic-migrations -n oficina -o jsonpath="{.status.conditions[?(@.type==\"Failed\")].status}" 2>/dev/null || true)
            if [ "${COMPLETE}" = "True" ]; then
              break
            fi
            if [ "${FAILED}" = "True" ]; then
              echo "O Job de migração falhou."
              kubectl describe job alembic-migrations -n oficina || true
              kubectl get pods -n oficina -l job-name=alembic-migrations -o wide || true
              kubectl logs -n oficina -l job-name=alembic-migrations --all-containers --prefix=true || true
              exit 1
            fi
            sleep 1
          done
          if [ "${COMPLETE}" != "True" ]; then
            echo "Timeout aguardando o Job de migração."
            exit 1
          fi
          kubectl apply -f k8s/target-group-binding.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Diagnosticar falha da migração
        if: failure()
        run: |
          kubectl get job alembic-migrations -n oficina -o yaml || true
          kubectl describe job alembic-migrations -n oficina || true
          kubectl get pods -n oficina -l job-name=alembic-migrations -o wide || true
          kubectl describe pods -n oficina -l job-name=alembic-migrations || true
          kubectl logs -n oficina -l job-name=alembic-migrations --all-containers --prefix=true || true

      - name: Aguardar rollout do deployment
        run: |
          kubectl rollout status deployment/oficina-api -n oficina --timeout=120s
