name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Atualizar tag da imagem nos manifestos
        run: |
          IMAGE="ghcr.io/${{ secrets.GHCR_USERNAME }}/tech-challenge-fiap/tech-challenge-app"
          TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          sed -i "s|image: ghcr.io/.*/tech-challenge-app:.*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml
          sed -i "s|image: ghcr.io/.*/tech-challenge-app:.*|image: ${IMAGE}:${TAG}|" k8s/migration-job.yaml

      - name: Instalar Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: tech-challenge
          wait: 120s

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform init e apply
        working-directory: terraform
        env:
          TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Aguardar rollout do deployment
        run: |
          kubectl rollout status deployment/oficina-api -n oficina --timeout=120s
