services:
  app:
    build:
      dockerfile: Dockerfile.dev
    ports:
      - "5678:5678"
    volumes:
      - ./src:/app/src
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oficina:oficina123@db:5432/oficina
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      retries: 10
      start_period: 15s

  db:
    environment:
      - POSTGRES_DB=oficina
      - POSTGRES_USER=oficina
      - POSTGRES_PASSWORD=oficina123
