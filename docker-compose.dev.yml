services:
  app:
    build:
      dockerfile: Dockerfile
    ports:
      - "5678:5678"
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oficina_admin:oficina123@db:5432/oficina
      - CPF_VALIDATOR_LAMBDA_ARN=
      - JWT_SECRET=dev-secret-key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=oficina
      - POSTGRES_USER=oficina_admin
      - POSTGRES_PASSWORD=oficina123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_admin -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
